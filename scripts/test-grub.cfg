# Embedded test config: mirrors the real menu (same 5 entries incl. both submenus) so the
# theme is exercised exactly as it renders on the machine — without touching the real boot.
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod fat
insmod search_fs_file
set gfxmode=1920x1080x32,1024x768,auto
terminal_output gfxterm

search --no-floppy --file --set=root /themes/cachyos-pro/theme.txt
for pf2 in /themes/cachyos-pro/cantarell_bold_48.pf2 /themes/cachyos-pro/cantarell_regular_24.pf2 /themes/cachyos-pro/cantarell_regular_19.pf2 /themes/cachyos-pro/dejavu_sans_15.pf2 /themes/cachyos-pro/terminus-18.pf2 ; do
  loadfont $pf2
done
set theme=/themes/cachyos-pro/theme.txt
export theme

set timeout=8
set default=0

menuentry 'CachyOS Linux' --class cachyos --class gnu-linux --class os { echo boot; }
submenu 'Advanced options for CachyOS Linux  ▶' --class linux {
  menuentry 'CachyOS Linux, with Linux linux-cachyos' { echo boot; }
  menuentry 'CachyOS Linux, with Linux linux-cachyos-lts' { echo boot; }
}
menuentry 'Windows 11' --class windows11 --class windows --class os { echo boot; }
menuentry 'UEFI Firmware Settings' --class efi { echo boot; }
submenu 'CachyOS Linux snapshots  ▶' --class snapshots {
  menuentry '| 2026-10-14 19:18:10 | @/.snapshots/835/snapshot | post |' { echo boot; }
  menuentry '  vmlinuz-linux-cachyos-lts & initramfs-linux-cachyos-lts.img' { echo boot; }
}
