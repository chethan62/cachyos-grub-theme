# Deliberately broken-theme config: proves what the machine shows if the theme cannot load.
# Identical to test-grub.cfg except the theme path does not exist (the realistic case: the theme dir
# was moved/cleaned, or GRUB_THEME has a typo). The fonts still load, so GRUB's built-in menu should
# render and every entry must remain listed and selectable.
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod fat
insmod search_fs_file
set gfxmode=1920x1080x32,1024x768,auto
terminal_output gfxterm

search --no-floppy --file --set=root /themes/cachyos-pro/background.png
for pf2 in /themes/cachyos-pro/cantarell_bold_48.pf2 /themes/cachyos-pro/cantarell_regular_24.pf2 /themes/cachyos-pro/cantarell_regular_19.pf2 /themes/cachyos-pro/dejavu_sans_15.pf2 ; do
  loadfont $pf2
done
set theme=/themes/cachyos-pro/does-not-exist.txt
export theme

set timeout=8
set default=0

menuentry 'CachyOS Linux' --class cachyos --class gnu-linux --class os { echo boot; }
submenu 'Advanced options for CachyOS Linux  ▶' --class linux {
  menuentry 'CachyOS Linux, with Linux linux-cachyos' { echo boot; }
  menuentry 'CachyOS Linux, with Linux linux-cachyos-lts' { echo boot; }
}
menuentry 'Windows 11' --class windows11 --class windows --class os { echo boot; }
menuentry 'UEFI Firmware Settings' --class efi { echo boot; }
submenu 'CachyOS Linux snapshots  ▶' --class snapshots {
  menuentry '| 2026-10-14 19:18:10 | @/.snapshots/835/snapshot | post |' { echo boot; }
  menuentry '  vmlinuz-linux-cachyos-lts & initramfs-linux-cachyos-lts.img' { echo boot; }
}
