name: build

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rsvg-convert for the SVG assets, ImageMagick for the slices/icons, grub for grub-mkfont
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick grub-common fonts-cantarell mtools
          # print where the fonts actually landed: font packaging differs per distro, and the build
          # discovers them by glob, so the layout belongs in the log rather than in a guess
          ls -d /usr/share/fonts/*/cantarell /usr/share/fonts/*/*/cantarell 2>/dev/null || true
          ls /usr/share/fonts/*/cantarell/ /usr/share/fonts/*/*/cantarell/ 2>/dev/null || true

      - name: Run every check (assets, numbers, installer logic, menu audit, render)
        run: bash scripts/verify.sh
